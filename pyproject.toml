[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edu-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pillow>=11.3,<13",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.9,<3",
    "python-multipart>=0.0.22,<1",
    "sqlalchemy>=2.0.39,<3",
    "sympy>=1.14,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.24,<2",
    "azure-servicebus>=7.14,<8",
    "azure-storage-blob>=12.26,<13",
    "PyJWT[crypto]>=2.10,<3",
]
hosted = [
    "azure-ai-agentserver-invocations",
    "azure-ai-projects>=2.0,<3",
    "azure-identity>=1.24,<2",
    "openai>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["packages/domain/edu_domain", "services/app/edu_app", "services/foundry-agent/edu_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["packages/domain", "services/app", "services/foundry-agent"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
